services:
  kong:
    build: .
    container_name: kong-gateway
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_LUA_PACKAGE_PATH: /usr/local/share/lua/5.1/?.lua;;
      KONG_NGINX_HTTP_INCLUDE: /etc/kong/shared-dicts.conf
      KONG_NGINX_MAIN_INCLUDE: /etc/kong/main-env.conf
      KONG_UNTRUSTED_LUA_SANDBOX_REQUIRES: gateway_health,auth0_validator,resty.openidc
      KONG_LUA_SSL_TRUSTED_CERTIFICATE: /etc/ssl/certs/ca-certificates.crt
      KONG_LUA_SSL_VERIFY_DEPTH: 5
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      AUTH0_ROLE_CLAIM: ${AUTH0_ROLE_CLAIM:-https://discordia.app/role}
      AUTH0_EMAIL_CLAIM: ${AUTH0_EMAIL_CLAIM:-https://discordia.app/email}
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./kong.yml:/usr/local/kong/declarative/kong.yml:ro
      - ./auth0_validator.lua:/usr/local/share/lua/5.1/auth0_validator.lua:ro
      - ./gateway_health.lua:/usr/local/share/lua/5.1/gateway_health.lua:ro
      - ./nginx/shared-dicts.conf:/etc/kong/shared-dicts.conf:ro
      - ./nginx/main-env.conf:/etc/kong/main-env.conf:ro   # nuevo mount
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - discordia-net

  redis:
    image: redis:7-alpine
    container_name: kong-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - discordia-net

networks:
  discordia-net:
    name: discordia-net
    driver: bridge