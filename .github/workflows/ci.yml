name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Tests del validador de Auth0 (corren el .lua con un runtime de Lua embebido, lupa) y chequeos
      # estáticos de kong.yml (PyYAML)
      - name: Install test dependencies
        run: pip install lupa pytest pyyaml

      - name: Run tests
        run: pytest tests/

      # La imagen arranca solo si render-config.sh completa todos los destinos de kong.yml
      - name: Check kong.yml template
        run: |
          missing=$(grep -n '^[^#]*\${' kong.yml | grep -vE '\$\{(AUTH_SERVICE|SERVER_ROLES|PAYMENTS|CHAT_ENGINE|VOICE_SIGNALING|NOTIFICATION|LIVEKIT_SIGNALING)_URL\}' || true)
          if [ -n "$missing" ]; then
            echo "Variables en kong.yml sin default en render-config.sh:"; echo "$missing"; exit 1
          fi

  docker:
    # PR: construye la imagen para validar el Dockerfile. Push a main/develop: además la publica en GHCR
    # con el SHA del commit (lo que se despliega) y el nombre de la rama. Sin "latest".
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/discordia-g12/gateway
      PUSH: ${{ github.event_name == 'push' }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # Opcional: evita el límite de descargas anónimas de Docker Hub (imágenes base)
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch

      # Kong DB-less no arranca con un campo desconocido o una ruta inválida: se valida la config ya
      # renderizada (el entrypoint completa las variables y después corre el comando) antes de publicar
      - name: Build for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: gateway:ci
          cache-from: type=gha

      - name: Validate declarative config
        run: docker run --rm gateway:ci kong config parse /tmp/kong.yml

      - name: Build (and push on main/develop)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Solo en push a main, con la imagen ya en GHCR: el workflow del orquestador la despliega en el nodo edge
  # por SSM y falla si no queda healthy (en ese caso el nodo vuelve solo al tag anterior).
  deploy:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    uses: discordia-g12/discordia-orchestrator/.github/workflows/deploy.yml@main
    with:
      service: gateway
      node: edge
      sha: ${{ github.sha }}
